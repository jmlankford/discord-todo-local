version: "3.8"

services:
  taskbot:
    image: ghcr.io/jmlankford/discord-todo-local:latest
    container_name: taskbot
    restart: unless-stopped
    ports:
      - "8080:8080"          # Change the left side if 8080 is taken on your server
    volumes:
      - /mnt/user/appdata/taskbot/data:/data   # Adjust left side to your Unraid appdata path
    environment:
      # ── Discord ─────────────────────────────────────────────────────────────
      DISCORD_TOKEN: "YOUR_DISCORD_BOT_TOKEN_HERE"
      GUILD_ID: "YOUR_DISCORD_GUILD_ID_HERE"
      CHANNEL_ID: "YOUR_DISCORD_CHANNEL_ID_HERE"

      # ── Twilio (core) ────────────────────────────────────────────────────────
      TWILIO_SID: "YOUR_TWILIO_ACCOUNT_SID_HERE"         # Starts with AC
      TWILIO_AUTH: "YOUR_TWILIO_AUTH_TOKEN_HERE"
      TWILIO_FROM: "YOUR_TWILIO_PHONE_NUMBER_HERE"        # E.164 e.g. +17165550000

      # ── Twilio (API key — used for outbound calls) ───────────────────────────
      TWILIO_API_KEY: "YOUR_TWILIO_API_KEY_SID_HERE"      # Starts with SK
      TWILIO_API_SECRET: "YOUR_TWILIO_API_SECRET_HERE"

      # ── Bloom & Rose voice routing ───────────────────────────────────────────
      FORWARD_NUMBER: "YOUR_REAL_FORWARDING_NUMBER_HERE"  # E.164 e.g. +17165550001

      # ── User phones (E.164 format) ───────────────────────────────────────────
      PHONE_JOSH: "YOUR_JOSH_PHONE_NUMBER_HERE"
      PHONE_JB: "YOUR_JB_PHONE_NUMBER_HERE"
      PHONE_ZACH: "YOUR_ZACH_PHONE_NUMBER_HERE"

      # ── Optional: protect /sms/send and /sms/alert endpoints ─────────────────
      SMS_SECRET: "YOUR_CHOSEN_SECRET_KEY_HERE"

      # ── Server ───────────────────────────────────────────────────────────────
      BASE_URL: "https://switchboard.thebloomandrose.com"  # Your public subdomain
      PORT: "8080"
      STATE_FILE: "/data/task_state.json"
      MFA_CODE_FILE: "/data/wave_mfa_code.txt"
      TZ: "America/New_York"

  # ── Web UI for managing the task lists (tasks.lankamerica.com) ───────────────
  # Separate container, same stack. Reuses the same Discord credentials.
  # Reads /data read-only so its task numbering matches the digest's blocklist.
  taskbot-web:
    image: ghcr.io/jmlankford/discord-todo-local-web:latest
    container_name: taskbot-web
    restart: unless-stopped
    ports:
      - "8091:8080"          # 8080/8081 = lank-survey-ape, 8090 = taskbot; 8091 is free
    volumes:
      - /mnt/user/appdata/taskbot/data:/data:ro   # read-only: web never writes state
    environment:
      # Reuse the SAME Discord values already set on the taskbot service above.
      DISCORD_TOKEN: "YOUR_DISCORD_BOT_TOKEN_HERE"
      GUILD_ID: "YOUR_DISCORD_GUILD_ID_HERE"
      CHANNEL_ID: "YOUR_DISCORD_CHANNEL_ID_HERE"
      # Web-only secrets — set these in the Portainer stack env, not in the repo.
      APP_PASSWORD: "SET_IN_PORTAINER_ENV"        # shared login password
      SESSION_SECRET: "SET_IN_PORTAINER_ENV"      # random, e.g. `openssl rand -hex 32`
      PORT: "8080"
      STATE_FILE: "/data/task_state.json"
      TZ: "America/New_York"
