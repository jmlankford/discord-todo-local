<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBot · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>TaskBot</h1>
    <p class="sub">Enter the shared password to continue.</p>
    {% if error %}<p class="banner error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <input type="password" name="password" placeholder="Password"
             aria-label="Password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
